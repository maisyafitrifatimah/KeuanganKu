<ion-header>
  <ion-toolbar>
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>

    <ion-item button (click)="bukaHalaman('rekening')">
      <ion-icon name="wallet-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Rekening</ion-label>
    </ion-item>

    <ion-item button (click)="bukaHalaman('kategori')">
      <ion-icon name="pricetags-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Kategori</ion-label>
    </ion-item>

    <ion-item button (click)="bukaHalaman('pin')">
      <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
      <ion-label>PIN</ion-label>
    </ion-item>

    <ion-item button (click)="bukaHalaman('excel')">
      <ion-icon name="download-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Ekspor Excel</ion-label>
    </ion-item>

    <ion-item button (click)="bukaHalaman('penilaian')">
      <ion-icon name="star-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Beri Penilaian</ion-label>
    </ion-item>

    <ion-item button (click)="bukaHalaman('bagikan')">
      <ion-icon name="share-social-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Bagikan</ion-label>
    </ion-item>

    <ion-item button (click)="bukaHalaman('info')">
      <ion-icon name="information-circle-outline" slot="start" color="primary"></ion-icon>
      <ion-label>Info</ion-label>
    </ion-item>

  </ion-list>
</ion-content>
