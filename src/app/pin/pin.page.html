<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>PIN</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="full" color="light" [disabled]="!isPinSet" (click)="deletePin()">
    Hapus PIN
  </ion-button>

  <ion-button expand="full" color="primary" [disabled]="isPinSet" (click)="showPinSetup()">
    Atur PIN
  </ion-button>

  <div *ngIf="isPinSetupVisible" class="pin-setup ion-text-center">
    <h3>Masukkan PIN (6 Angka)</h3>
    <div class="pin-dots">
      <span *ngFor="let dot of dots" [class.filled]="dot <= pin.length">●</span>
    </div>
    <ion-grid>
      <ion-row>
        <ion-col size="4" *ngFor="let num of keypad">
          <ion-button expand="full" (click)="addDigit(num)">{{ num }}</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
    <ion-button expand="full" color="success" (click)="setPin()">
      Simpan PIN
    </ion-button>
    <ion-button expand="full" color="medium" (click)="clearPin()">
      Hapus Input
    </ion-button>
  </div>
</ion-content>

<style>
.pin-dots {
  display: flex;
  justify-content: center;
  margin: 15px 0;
  font-size: 2em;
}
.pin-dots span {
  margin: 0 5px;
  color: #ccc;
}
.pin-dots span.filled {
  color: #000;
}
</style>
