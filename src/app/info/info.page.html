<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Info</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="info-container" style="text-align: center; margin-top: 60px;">
    <img src="assets/icon/keuanganku.jpeg" alt="Logo DompetKu" style="width: 100px; margin-bottom: 20px;" />

    <h1 style="font-size: 26px; font-weight: bold;">{{ namaApp }}</h1>
    <h2 style="font-size: 16px; color: #666;">Version {{ versiApp }}</h2>
    <p style="margin-top: 10px; font-size: 15px;">by {{ developer }}</p>

    <footer style="margin-top: 40px;">
      <p style="font-size: 13px; color: #999;">&copy; 2025 {{ namaApp }}. All rights reserved.</p>
    </footer>
  </div>
</ion-content>
